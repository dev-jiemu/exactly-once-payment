# 로컬 개발용 인프라: PostgreSQL(원장·멱등 키) + Redpanda(요청 버퍼·이벤트)
# Redpanda: 아파치 카프카(Apache Kafka)와 호환되면서도 더 빠르고 가볍게 설계된 고성능 실시간 데이터 스트리밍 플랫폼
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.2
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"   # 애플리케이션(호스트)에서 접속하는 Kafka API
      - "9644:9644"     # Admin API
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
