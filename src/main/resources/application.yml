spring:
  application:
    name: exactly-once-payment

  # PG 응답 대기(블로킹 I/O)를 가상 스레드로 처리
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/payment
    username: payment
    password: payment

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: localhost:19092
    producer:
      # 접수 버퍼 적재: 브로커 복제 완료 후 ack, 프로듀서 재시도로 인한 중복은 브로커가 제거
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      # offset은 DB 처리 후 직접 커밋 (at-least-once)
      enable-auto-commit: false
      auto-offset-reset: earliest
      isolation-level: read_committed
    listener:
      ack-mode: manual

payment:
  topics:
    requests: payment-requests
    events: payment-events
  pg:
    # 같은 애플리케이션 안의 fakepg 컨트롤러를 루프백으로 호출한다(연습용 가짜 PG).
    base-url: http://localhost:8080/fakepg
    connect-timeout: 2s
    read-timeout: 3s
  sweeper:
    unresolved-after: 20s
    batch-size: 20
    interval: 5s
  outbox:
    interval: 1s
    batch-size: 50
  worker:
    # processed_events.consumer_group 값과 반드시 일치해야 한다.
    consumer-group: payment-worker

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
